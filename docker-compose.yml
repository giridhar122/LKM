version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lkm_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lkm_smartdesk
      MYSQL_USER: lkm_user
      MYSQL_PASSWORD: lkmpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lkm_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=lkm_user
      - DB_PASSWORD=lkmpassword
      - DB_NAME=lkm_smartdesk
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WHATSAPP_VERIFY_TOKEN=lkm_smartdesk_webhook_verify_token_2026
      - WHATSAPP_SIMULATION_MODE=true
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lkm_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mysql_data:
