services:
  - type: web
    name: lkm-smartdesk-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_SQLITE_FALLBACK
        value: "True"
      - key: TELEGRAM_ENABLED
        value: "True"
      - key: TELEGRAM_POLLING_MODE
        value: "True"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        value: "localhost"
      - key: DB_USER
        value: "root"
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: "lkm_smartdesk"
